baseURL = "https://hmgoodman.github.io/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
title = "게임 메모장"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[services]
  [services.googleAnalytics]
    ID = "G-P8TR3GWWN4"

# 관련 글 추천: categories를 가장 중요하게, tags를 그다음, date는 낮은 가중치로 참고만 한다.
[related]
  includeNewer = true
  threshold = 20
  toLower = false
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

[params]
  # env을 강제로 "production"으로 고정하지 않는다 — `hugo`/`hugo --minify`(배포 빌드)는
  # hugo.IsProduction이 기본값으로 이미 true라 별도 설정이 필요 없고, 여기서 고정해버리면
  # `hugo server`로 로컬에서 미리 볼 때도 Search Console 색인 허용과 GA4 추적이 강제로 켜져버린다.
  description = "POE2, 니케(NIKKE) 등 게임 파밍/공략/초보 가이드를 정리하는 게임 정보 블로그"
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = true
  ShowBreadCrumbs = true
  ShowRssButtonInSectionTermList = true

  # Google Search Console 소유권 확인용. 토큰을 전달받으면 SiteVerificationTag 값만 채워 넣으면 바로 적용됨.
  # (예: SiteVerificationTag = "abc123...") 값이 비어 있으면 태그 자체가 렌더링되지 않는다.
  [params.analytics.google]
    SiteVerificationTag = "NVJ8wj12xam-e3ZShTeanCPccN4dh22JdTUz0vVljwE"

  # 네이버 서치어드바이저 소유권 확인용. 토큰을 전달받으면 SiteVerificationTag 값만 채워 넣으면 바로 적용됨.
  # HTML 파일 방식으로 인증할 경우 해당 파일을 static/ 아래에 추가하면 된다(별도 설정 불필요).
  [params.analytics.naver]
    SiteVerificationTag = "2332f218ae2378b76b724b8438eb45ccf0291d8e"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "홈"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "poe2"
    name = "POE2"
    url = "/categories/poe2/"
    weight = 20
  [[menu.main]]
    identifier = "poe1"
    name = "POE1"
    url = "/categories/poe1/"
    weight = 25
  [[menu.main]]
    identifier = "nikke"
    name = "NIKKE"
    url = "/categories/nikke/"
    weight = 30
  [[menu.main]]
    identifier = "posts"
    name = "전체 글"
    url = "/posts/"
    weight = 40
  [[menu.main]]
    identifier = "tags"
    name = "태그"
    url = "/tags/"
    weight = 50
  [[menu.main]]
    identifier = "search"
    name = "검색"
    url = "/search/"
    weight = 60
